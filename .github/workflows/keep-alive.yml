name: Backend Keep Alive

on:
  schedule:
    # Ping every 10 minutes to prevent Render's 15-minute idle spin-down
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL variable or secret is not set; skipping ping."
            exit 0
          fi

          TARGET_URL="${BACKEND_URL%/}/health/"
          echo "Pinging $TARGET_URL"
          curl -fsS --retry 2 --retry-delay 5 --max-time 60 "$TARGET_URL"
          echo ""
